name: 构建并发布

# 触发方式：
#   1. 推送 v* 标签（如 v2.0.0）→ 自动构建 exe 并创建 Release
#   2. 手动触发 → 只构建，产物作为 workflow artifact 供下载（不建 Release）
#
# 为什么用 windows-latest：
#   Nuitka 是原生编译，无法交叉编译到 Windows；且服务生命周期管理
#   依赖 Windows API（DETACHED_PROCESS / winget / 注册表）。
#
# 为什么用 python.org 的解释器：
#   conda 环境会让 Nuitka 报 flavor 'Anaconda Python'，
#   其 PySide6 插件枚举 conda 元数据时会 KeyError: 'files' 直接崩。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write          # 创建 Release 需要

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # **必须钉在 6.11.x**：QtWebEngine 的内核版本决定网页兼容性 ——
          #   6.9.x = Chromium 130 ｜ 6.10.x = 134 ｜ 6.11.x = 140
          # DSH 0.1.6-alpha.2 的前端需要 Chromium >= 140（Uint8Array.fromBase64 等），
          # 用 6.9.3 打出来的 exe 会让侧边栏文件预览报「文件资源服务不可用」。
          # 详见 docs/file-preview-unavailable-triage.md
          pip install PySide6==6.11.2
          pip install nuitka==4.2.1

      - name: 校验 tag 与源码里的版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          SRC=$(python -c "from dsh_host.version import HOST_VERSION; print(HOST_VERSION)")
          echo "tag=$TAG  源码=$SRC"
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::tag ($TAG) 与 dsh_host/version.py 的 HOST_VERSION ($SRC) 不一致"
            exit 1
          fi

      - name: 契约层自测
        # CI runner 上没有装 DSH，跑不了真实链路（定位/启动/就绪/停止）。
        # 精简模式只验证不依赖 DSH 的纯逻辑：版本代数比较、prefix 反推、
        # 适配表合并、URL 解析规则、数据指纹判断、路径规划。
        env:
          DSH_SELFTEST_LITE: "1"
        run: python tools/contract_selftest.py

      - name: GUI 自测（静态，无头）
        # 同理：不起真实服务，只验证引导窗口三状态渲染、更新对话框文案、
        # 桌面壳自更新纯逻辑。
        env:
          QT_QPA_PLATFORM: offscreen
          DSH_GUI_SELFTEST_STATIC: "1"
        run: python tools/gui_selftest.py

      - name: 打包
        shell: bash
        env:
          # 要保留的 Chromium 语言包（决定网页右键菜单 / PDF 查看器 / 错误页的文案）。
          # **加语言就往这里加名字**，不用改下面的逻辑。
          # 裁掉的语言会回退到 en-US —— 不会空白，只是英文。
          KEEP_LOCALES: "zh-CN zh-TW en-US en-GB"
        run: |
          # 关于 --include-data-dir：**不能省**。
          #
          # `--windows-icon-from-ico` 只是把图标塞进 exe 自身的 PE 资源
          # （资源管理器看的那个），而运行时 QIcon("assets/xxx.ico") 是去
          # **文件系统**读的。Nuitka onefile 不会自动带上 assets/，
          # 少了这行，图标在源码里能用、打包后静默失效。
          #
          # 正确性由下面"在产物上做资源自检"那一步兜住——
          # 它在真实产物上验证 assets 能否解析、图标能否加载。
          #
          # 关于 --onefile-tempdir-spec 里的版本后缀：**不能省**（2026-10-01 实测）。
          #
          # onefile 会把程序解包到那个目录再运行。如果新旧版本共用同一个目录，
          # **旧实例还活着时新实例根本起不来**——里面那个 <同名的>.exe 正被旧
          # 进程锁着，Nuitka 直接报错退出：
          #     Error, failed to open '...\DSH-Web-runtime\probe.exe' for writing.
          #     退出码 2（0.2 秒就死了，用户看到的是"点了重启什么都没发生"）
          #
          # 而"应用内就地替换"这条更新路径**必须让新旧同跑**（新实例是在旧实例
          # 退出前被拉起来的）。所以每个版本用各自的解包目录，实测这样就能共存。
          # 旧的解包目录由 dsh_host/selfupdate.py 的 cleanup_stale_runtimes 清理。
          #
          # ---------------------------------------------------------------
          # 裁剪（2026-10-19，实测 467 MB/443 文件 → 327 MB/94 文件）
          #
          # 体积只降 15%，但**每次启动快 1.0~1.5 s**（冷启动 2.4 s）。原因是
          # onefile 解包/校验的成本按**文件数**走，不是按字节数：裁掉的 353 个
          # 文件里，语言包占 349 个。详见 docs/packaging-trim.md。
          #
          # ⚠️ `--noinclude-data-files` 是**最终过滤器**：想"先全排、再用
          # --include-data-files 把白名单补回来"是行不通的，补的会被一起吃掉
          # （实测 dist 里 translations 直接为空）。所以只能精确排除。
          # ---------------------------------------------------------------
          PYSIDE_DIR=$(python -c "import PySide6, os; print(os.path.dirname(PySide6.__file__))")
          NOINC=()
          for f in "$PYSIDE_DIR"/translations/qtwebengine_locales/*.pak; do
            NAME=$(basename "$f" .pak)
            KEEP=0
            for k in $KEEP_LOCALES; do
              if [ "$NAME" = "$k" ]; then KEEP=1; break; fi
            done
            if [ "$KEEP" = "0" ]; then
              NOINC+=("--noinclude-data-files=PySide6/translations/qtwebengine_locales/$(basename "$f")")
            fi
          done
          echo "保留语言包: $KEEP_LOCALES"
          echo "排除语言包: ${#NOINC[@]} 个"
          python -m nuitka --onefile \
            --windows-console-mode=disable \
            --windows-icon-from-ico=assets/icon.ico \
            --include-data-dir=assets=assets \
            --enable-plugin=pyside6 \
            --include-package=dsh_host \
            --include-module=dsh_panel \
            --include-module=dsh_theme \
            --include-module=dsh_devtools \
            --include-module=dsh_console \
            --include-module=dsh_icons \
            --onefile-tempdir-spec={CACHE_DIR}/DSH-Web-runtime-${{ github.ref_name }} \
            --output-dir=build \
            --output-filename=DSH-Web.exe \
            --lto=yes \
            --assume-yes-for-downloads \
            --noinclude-data-files="*.debug.pak" \
            --noinclude-data-files="PySide6/translations/*.qm" \
            --noinclude-dlls="qt6pdf.dll" \
            --noinclude-dlls="PySide6/qt-plugins/imageformats/qpdf.dll" \
            "${NOINC[@]}" \
            dsh_gui_qt.py

      - name: 确认裁剪生效
        # 排除参数写错**不会报错**，只会静默把 143 MB / 353 个文件塞回来
        # （"产物存在"那步的下限是 20 MB，拦不住）。
        # 所以直接查 Nuitka 留下的 dist 目录 —— 它是 onefile payload 的原料，
        # 看它等于看包里到底有什么。
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import os
          import sys

          # CI runner（Windows）的 stdout 是 cp1252，直接 print 中文会抛
          # UnicodeEncodeError —— 异常会把"检查通过"变成"退出码 1"。
          # 项目里 resource_report() 那次踩过同一个坑，这里必须先改编码。
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")

          DIST = "build/dsh_gui_qt.dist"
          KEEP = {"zh-CN", "zh-TW", "en-US", "en-GB"}
          bad = []

          if not os.path.isdir(DIST):
              print("::error::找不到 %s，无法核对裁剪结果" % DIST)
              sys.exit(1)

          # 1. DevTools 调试符号资源不该在（单个 76 MB）
          for p in glob.glob(os.path.join(DIST, "*.debug.pak")):
              bad.append("调试资源未裁掉: " + os.path.basename(p))

          # 2. Qt6Pdf 及其图像插件不该在
          for rel in ("qt6pdf.dll",
                      os.path.join("PySide6", "qt-plugins", "imageformats", "qpdf.dll")):
              if os.path.exists(os.path.join(DIST, rel)):
                  bad.append("未裁掉: " + rel)

          # 3. Qt 框架翻译（.qm）不该在
          qm = glob.glob(os.path.join(DIST, "PySide6", "translations", "*.qm"))
          if qm:
              bad.append("Qt 翻译未裁掉: %d 个 .qm" % len(qm))

          # 4. Chromium 语言包必须**恰好**等于白名单
          loc = os.path.join(DIST, "PySide6", "translations", "qtwebengine_locales")
          got = ({os.path.splitext(f)[0] for f in os.listdir(loc)}
                 if os.path.isdir(loc) else set())
          if got != KEEP:
              bad.append("语言包集合不对，实际=%s" % sorted(got))

          # 5. 文件数兜底（裁剪前 443；参数全失效时会立刻露馅）
          total = sum(len(fn) for _, _, fn in os.walk(DIST))
          print("dist 文件总数: %d（裁剪前 443）" % total)
          if total > 130:
              bad.append("文件数 %d 偏多，裁剪可能没生效" % total)

          if bad:
              for b in bad:
                  print("::error::" + b)
              sys.exit(1)
          print("裁剪核对通过：语言包=%s，文件数=%d" % (sorted(got), total))
          PY

      - name: 确认产物存在
        shell: bash
        run: |
          ls -la build/DSH-Web.exe
          SIZE=$(stat -c%s build/DSH-Web.exe)
          echo "产物大小: $SIZE 字节"
          # 太小说明构建有问题，别把坏文件发出去
          if [ "$SIZE" -lt 20000000 ]; then
            echo "::error::产物只有 $SIZE 字节，明显不完整"
            exit 1
          fi

      - name: 在产物上做资源自检
        # 源码树里 assets/ 永远存在，所以单元测试全绿也证明不了"包里带了"。
        # 这一步直接问打包产物自己：assets 解析到哪、图标能不能加载、
        # **内联 SVG 图标能不能渲染**（控制面板的图标靠 QtSvg，这是本项目
        # 第一次在产物里用 QtSvg——漏收它的库会表现为图标全部空白）。
        # 少了这一步，图标会在发布后才被发现是坏的。
        shell: bash
        run: |
          # 报告用相对路径：exe 在 bash 的 cwd 下运行，避免 Windows/POSIX
          # 路径混写带来的坑。
          DSH_HOST_RESOURCE_CHECK="resource-check.txt" ./build/DSH-Web.exe || CODE=$?
          CODE=${CODE:-0}
          echo "退出码=$CODE"
          echo "----- 自检报告 -----"
          cat resource-check.txt 2>/dev/null || echo "(没写出报告)"
          if [ "$CODE" != "0" ]; then
            echo "::error::打包产物资源自检未通过（退出码 $CODE），图标会是坏的"
            exit 1
          fi

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Web
          path: build/DSH-Web.exe
          retention-days: 30

      - name: 准备更新说明
        # 说明正文写在 `docs/releases/<tag>.md`，和代码一起提交、一起评审。
        #
        # 为什么不再只靠 generate_release_notes（2026-10-20 改）：它只会生成
        # 一条 "Full Changelog" 链接——用户点开 Release 页面看不到"这版改了什么"。
        # v2.3.8 / v2.3.9 就是这么发出去的，事后才发现说明是空的。
        #
        # 缺文件不失败（不挡发版），但会打一条 warning，让它显眼。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          NOTE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTE" ]; then
            cp "$NOTE" release-body.md
            echo "更新说明来自 $NOTE（$(wc -c < release-body.md) 字节）"
          else
            echo "::warning::缺少 $NOTE —— 本次 Release 只有自动生成的变更列表"
            : > release-body.md
          fi

      - name: 创建 Release 并附带 exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DSH-Web.exe
          body_path: release-body.md
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
