name: 构建并发布

# 触发方式：
#   1. 推送 v* 标签（如 v2.0.0）→ 自动构建 exe 并创建 Release
#   2. 手动触发 → 只构建，产物作为 workflow artifact 供下载（不建 Release）
#
# 为什么用 windows-latest：
#   Nuitka 是原生编译，无法交叉编译到 Windows；且服务生命周期管理
#   依赖 Windows API（DETACHED_PROCESS / winget / 注册表）。
#
# 为什么用 python.org 的解释器：
#   conda 环境会让 Nuitka 报 flavor 'Anaconda Python'，
#   其 PySide6 插件枚举 conda 元数据时会 KeyError: 'files' 直接崩。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write          # 创建 Release 需要

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.9.3
          pip install nuitka==4.2.1

      - name: 校验 tag 与源码里的版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          SRC=$(python -c "from dsh_host.version import HOST_VERSION; print(HOST_VERSION)")
          echo "tag=$TAG  源码=$SRC"
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::tag ($TAG) 与 dsh_host/version.py 的 HOST_VERSION ($SRC) 不一致"
            exit 1
          fi

      - name: 契约层自测
        # CI runner 上没有装 DSH，跑不了真实链路（定位/启动/就绪/停止）。
        # 精简模式只验证不依赖 DSH 的纯逻辑：版本代数比较、prefix 反推、
        # 适配表合并、URL 解析规则、数据指纹判断、路径规划。
        env:
          DSH_SELFTEST_LITE: "1"
        run: python tools/contract_selftest.py

      - name: GUI 自测（静态，无头）
        # 同理：不起真实服务，只验证引导窗口三状态渲染、更新对话框文案、
        # 桌面壳自更新纯逻辑。
        env:
          QT_QPA_PLATFORM: offscreen
          DSH_GUI_SELFTEST_STATIC: "1"
        run: python tools/gui_selftest.py

      - name: 打包
        shell: bash
        run: |
          # 关于 --include-data-dir：**不能省**。
          #
          # `--windows-icon-from-ico` 只是把图标塞进 exe 自身的 PE 资源
          # （资源管理器看的那个），而运行时 QIcon("assets/xxx.ico") 是去
          # **文件系统**读的。Nuitka onefile 不会自动带上 assets/，
          # 少了这行，图标在源码里能用、打包后静默失效。
          #
          # 正确性由下面"在产物上做资源自检"那一步兜住——
          # 它在真实产物上验证 assets 能否解析、图标能否加载。
          python -m nuitka --onefile \
            --windows-console-mode=disable \
            --windows-icon-from-ico=assets/icon.ico \
            --include-data-dir=assets=assets \
            --enable-plugin=pyside6 \
            --include-package=dsh_host \
            --onefile-tempdir-spec={CACHE_DIR}/DSH-Web-runtime \
            --output-dir=build \
            --output-filename=DSH-Web.exe \
            --lto=yes \
            --assume-yes-for-downloads \
            dsh_gui_qt.py

      - name: 确认产物存在
        shell: bash
        run: |
          ls -la build/DSH-Web.exe
          SIZE=$(stat -c%s build/DSH-Web.exe)
          echo "产物大小: $SIZE 字节"
          # 太小说明构建有问题，别把坏文件发出去
          if [ "$SIZE" -lt 20000000 ]; then
            echo "::error::产物只有 $SIZE 字节，明显不完整"
            exit 1
          fi

      - name: 在产物上做资源自检
        # 源码树里 assets/ 永远存在，所以单元测试全绿也证明不了"包里带了"。
        # 这一步直接问打包产物自己：assets 解析到哪、图标能不能加载。
        # 少了这一步，图标会在发布后才被发现是坏的。
        shell: bash
        run: |
          # 报告用相对路径：exe 在 bash 的 cwd 下运行，避免 Windows/POSIX
          # 路径混写带来的坑。
          DSH_HOST_RESOURCE_CHECK="resource-check.txt" ./build/DSH-Web.exe || CODE=$?
          CODE=${CODE:-0}
          echo "退出码=$CODE"
          echo "----- 自检报告 -----"
          cat resource-check.txt 2>/dev/null || echo "(没写出报告)"
          if [ "$CODE" != "0" ]; then
            echo "::error::打包产物资源自检未通过（退出码 $CODE），图标会是坏的"
            exit 1
          fi

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Web
          path: build/DSH-Web.exe
          retention-days: 30

      - name: 创建 Release 并附带 exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DSH-Web.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
